# Optional: start PostgreSQL with Docker instead of installing it locally.
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: expense_voucher_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_voucher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
