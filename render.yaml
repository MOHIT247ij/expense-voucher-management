# Render Blueprint: one web service (API + built React app) and a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> select this repository -> Apply.
services:
  - type: web
    name: expense-voucher-management
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: expense-voucher-db
          property: connectionString

databases:
  - name: expense-voucher-db
    plan: free
    databaseName: expense_voucher
    user: expense_voucher
